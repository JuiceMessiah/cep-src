# apache-flink: Flink CEP uni project (Flink + Redpanda + API poller). Arcane project.
# Location: /mnt/fast/apps/stacks/apache-flink-cep/compose.yaml   (640 568:568)
# Compose project = "apache-flink-cep":
#   networks apache-flink-cep_core / apache-flink-cep_edge; broker data on /mnt/fast/scratch/redpanda
# Arcane mounts /mnt/fast/apps/stacks at the IDENTICAL path, so ./.env and
# ./poller.py resolve to the right host paths.
#
# Images are pinned by digest (runbook-cep-lab.md Phase 2).
#
# Flink version is pinned to 2.2.x ON PURPOSE: flink:latest is 2.3.0, and there is
# no Kafka connector for 2.3 yet (flink-connector-kafka 5.0.0 supports 2.1.x/2.2.x;
# Maven artifact 5.0.0-2.2). Don't bump Flink until a connector for the new
# version exists, and bump the connector in the job's pom at the same time.
#
# Files in this directory:
#   compose.yaml   640 568:568  (git)
#   poller.py      640 568:568  (git)
#   replay.py      640 568:568  (git)
#   scenarios/     750 568:568  (git: *.jsonl from backfill.py, files 640)
#   .env           600 568:568  (NOT in git: OWM_API_KEY=..., FIRMS_MAP_KEY=...; edit it in Arcane's
#                                .env editor, then check the mode: chmod 600 .env)
# backfill.py is in the repo too but runs on a laptop (needs internet + keys), not here.
#
# Networks:
#   core = internal (no internet, no LAN): redpanda, taskmanager, jobmanager, poller, sql-client
#   edge = normal bridge: jobmanager (to publish the UI) + poller (needs the APIs)

services:
  jobmanager:
    image: flink:2.2.1-java17@sha256:55ccb2ad4b98362c3f3503c5a6d7cd00b92eb25e38815ddaf0be5903ade54ffe
    container_name: flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"   # 0.0.0.0 ON PURPOSE (reached via the NAS tailnet IP); LAN side firewalled
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1600m
        web.submit.enable: true
        web.cancel.enable: true
    networks: [core, edge]
    mem_limit: 2g
    security_opt: ["no-new-privileges:true"]
    labels:
      com.getarcaneapp.arcane.updater: "false"
    restart: unless-stopped

  taskmanager:
    image: flink:2.2.1-java17@sha256:55ccb2ad4b98362c3f3503c5a6d7cd00b92eb25e38815ddaf0be5903ade54ffe
    container_name: flink-taskmanager
    command: taskmanager
    depends_on: [jobmanager]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 1728m
    networks: [core]
    mem_limit: 2g
    security_opt: ["no-new-privileges:true"]
    labels:
      com.getarcaneapp.arcane.updater: "false"
    restart: unless-stopped

  # Interactive tool, not a service: doesn't start with "Up".
  # Use: docker compose -f /mnt/fast/apps/stacks/apache-flink-cep/compose.yaml run --rm sql-client
  sql-client:
    image: flink:2.2.1-java17@sha256:55ccb2ad4b98362c3f3503c5a6d7cd00b92eb25e38815ddaf0be5903ade54ffe
    container_name: flink-sql-client
    command: bin/sql-client.sh
    profiles: ["tools"]
    depends_on: [jobmanager]
    stdin_open: true
    tty: true
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        rest.address: jobmanager
    networks: [core]
    security_opt: ["no-new-privileges:true"]
    labels:
      com.getarcaneapp.arcane.updater: "false"

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.6@sha256:8b1076e0d61bfceb66594dc01536427ce0b529f8ead35fdab9763ab6085891ce
    container_name: flink-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
      - --pandaproxy-addr=internal://0.0.0.0:8082
      - --advertise-pandaproxy-addr=internal://redpanda:8082
    volumes:
      # Dedicated dataset fast/scratch/redpanda with recordsize=4K, owned by the redpanda uid (101).
      # Redpanda asserts (exit 132) on ZFS's default 128K block size, so a named volume on
      # fast/ix-apps crash-loops. Outside fast/apps => no snapshots, replication or off-site: on purpose.
      - /mnt/fast/scratch/redpanda:/var/lib/redpanda/data
    networks: [core]
    mem_limit: 1536m
    security_opt: ["no-new-privileges:true"]
    labels:
      com.getarcaneapp.arcane.updater: "false"
    restart: unless-stopped

  # Interactive tool: replays a scenario (backfill.py output) into *.replay topics.
  # Use: docker compose -f /mnt/fast/apps/stacks/apache-flink-cep/compose.yaml run --rm replayer /scenarios/<name>.jsonl --duration 120
  replayer:
    image: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    container_name: flink-replayer
    profiles: ["tools"]
    user: "568:568"
    entrypoint: ["python", "-u", "/app/replay.py", "--proxy", "http://redpanda:8082"]
    volumes:
      - ./replay.py:/app/replay.py:ro
      - ./scenarios:/scenarios:ro
    networks: [core]          # no internet, no LAN: it only talks to redpanda
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    labels:
      com.getarcaneapp.arcane.updater: "false"

  poller:
    image: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    container_name: flink-poller
    command: ["python", "-u", "/app/poller.py"]
    user: "568:568"
    depends_on: [redpanda]
    env_file: ./.env          # Arcane's project .env (also used for compose interpolation; harmless)
    environment:
      PANDAPROXY_URL: http://redpanda:8082
      BBOX: "-10,35,30,45"        # west,south,east,north. Pick a region that is burning.
      GRID_STEP_DEG: "5"          # weather points = cells; also the CEP join key
      OWM_INTERVAL_S: "600"
      FIRMS_INTERVAL_S: "900"
      FIRMS_SOURCES: "VIIRS_NOAA20_NRT,VIIRS_NOAA21_NRT,VIIRS_SNPP_NRT"
      FIRMS_DAY_RANGE: "1"
    volumes:
      - ./poller.py:/app/poller.py:ro
    networks: [core, edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    labels:
      com.getarcaneapp.arcane.updater: "false"
    restart: unless-stopped

networks:
  core:
    internal: true
  edge: {}

